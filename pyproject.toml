[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-core-real-robot"
version = "0.1.0"
description = "Safe real-robot evaluation workspace for TCC-Core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.28",
  "PyYAML>=6.0",
  "typing-extensions>=4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]
robot = [
  "trossen-arm==1.9.3",
]
train = [
  "av>=13.1",
  "numpy>=1.26",
  "pyarrow>=17.0",
  "torch>=2.4",
  "torchvision>=0.19",
]
eval = [
  "av>=13.1",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pyarrow>=17.0",
  "torch>=2.4",
  "torchvision>=0.19",
]
realsense = [
  "pyrealsense2>=2.55",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# These scripts are called with ``python scripts/...`` and can be transferred
# through filesystems that do not preserve executable mode bits.
ignore = ["EXE001"]
