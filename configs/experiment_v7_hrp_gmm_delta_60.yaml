project: tcc-core-real-robot
seed: 1

dataset:
  repository: UoA-Trossen-Arm/pick_and_place_4_object_diverse
  revision: 6ce893dc73fc6310ccbd46786f71a03a5b6a3da2
  local_root: datasets/pick_and_place_4_object_diverse
  demonstrations_per_task: 100
  tasks:
    - pick_and_place_carrot_100
    - pick_and_place_pineapple_100
    - pick_and_place_starfruit_100
    - pick_and_place_strawberry_100

observations:
  fps: 20
  cameras: [cam_main, cam_wrist]
  resolution: [640, 480]

backbone:
  source: huggingface
  hub_name: hrp_imagenet
  checkpoint: null
  tcc_source_root: TBD
  frozen: true
  image_size: 224
  feature_cache_dtype: float16

model_hub:
  repository: Chipaipai/tcc-core-real-robot-policies
  revision: e40f3fe4a459cc6cbbbf338d07cd651455978213
  backbone_manifest: backbones/manifest.json
  policy_checkpoint_template: policies_v7_hrp_gmm_delta/{backbone}/{demonstrations}/checkpoint_050000.pt
  policy_metrics_template: policies_v7_hrp_gmm_delta/{backbone}/{demonstrations}/metrics.json
  supported_backbones:
    - ours_rn50
    - ours_vit
    - r3m_unadapted
    - d4r_imagenet
    - hrp_imagenet
  supported_demonstrations: [60]

policy:
  implementation: tcc_mlp_bc_v7_hrp_gmm_delta
  reference: hrp_data4robotics
  cameras: [cam_main, cam_wrist]
  shared_camera_backbone: true
  camera_fusion: raw_concat
  camera_projection_dim: 0
  camera_gate_hidden_dim: 0
  task_conditioning: one_hot
  number_of_tasks: 4
  proprioception: true
  proprioception_dim: 7
  progress_conditioning: null
  progress_dim: 0
  action_dim: 7
  action_chunk_size: 1
  action_representation: current_delta
  execution_delta_gain: 1.0
  action_distribution: gaussian_mixture
  num_modes: 5
  min_std: 0.0001
  deterministic_inference: highest_probability_mode_mean
  hidden_dimensions: [512, 512]
  activation: relu
  dropout: 0.2
  input_batch_norm: true
  input_layer_norm: false
  output_layer_scale: 1.0
  normalize_actions: true
  optimizer: adam
  loss: gmm_nll
  training_steps: 50000
  batch_size: 150
  learning_rate: 0.0001
  log_every: 1000

evaluation:
  max_rollout_steps: 359

split:
  train_episodes_per_task: 60
  validation_episodes_per_task: 20
  test_episodes_per_task: 20
  unused_episodes_per_task: 0
