robot:
  model: trossen_ai_solo
  role: follower
  driver_model: wxai_v0
  end_effector: wxai_v0_follower
  controller_ip: 192.168.1.4
  host_ip: 192.168.1.10
  subnet_prefix: 24
  expected_driver_series: "1.9"
  expected_firmware_series: "1.9"
  home_name: dataset_collection_home
  home_source: median_first_action_across_400_episodes
  home_arm_positions_rad:
    - -0.00019073777366429567
    - 1.046196699142456
    - 0.5239566564559937
    - 0.6292439103126526
    - -0.000572213320992887
    - 0.00019073777366429567

action_contract:
  dimensions: 7
  semantics: UNVERIFIED
  enabled: false

safety:
  dry_run_by_default: true
  require_explicit_execute_flag: true
  require_operator_confirmation: true
  require_emergency_stop_ready: true
  workspace_limits: CALIBRATING
  max_joint_delta_rad: 0.07
  max_joint_velocity_rad_s: 1.5
  max_gripper_delta_m: 0.003
  max_gripper_velocity_m_s: 0.06

workspace_calibration:
  status: collecting_points
  required_labels:
    - task_center
    - left_safe
    - right_safe
    - front_safe
    - back_safe
    - lowest_safe
    - highest_safe
    - demo_start_safe
  inward_margin_m:
    x: 0.02
    y: 0.02
    z_lower: 0.03
    z_upper: 0.02

diagnostic_tests:
  position_hold:
    duration_s: 2.0
    sample_rate_hz: 20.0
    max_arm_drift_rad: 0.02
    max_gripper_drift_m: 0.002
  current_position_hold:
    goal_time_s: 1.0
    duration_s: 2.0
    sample_rate_hz: 20.0
    max_arm_error_rad: 0.02
    max_gripper_error_m: 0.002
  gripper_cycle:
    open_delta_m: 0.005
    goal_time_s: 2.0
    hold_duration_s: 0.5
    sample_rate_hz: 20.0
    max_tracking_error_m: 0.001
  whole_arm_cycle:
    joint_deltas_rad: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03]
    goal_time_s: 3.0
    hold_duration_s: 0.5
    sample_rate_hz: 20.0
    max_tracking_error_rad: 0.02
    joint_limit_margin_rad: 0.01
  cartesian_step:
    home_goal_time_s: 10.0
    max_home_tracking_error_rad: 0.03
    goal_time_s: 2.0
    hold_duration_s: 0.5
    max_translation_step_m: 0.01
    max_downward_step_m: 0.005
    max_tracking_error_m: 0.005
    trajectory_check_samples: 1000
