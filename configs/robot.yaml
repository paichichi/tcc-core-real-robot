robot:
  model: trossen_ai_solo
  role: follower
  driver_model: wxai_v0
  end_effector: wxai_v0_follower
  motor_parameters: wxai_v0_20250509
  controller_ip: 192.168.1.4
  host_ip: 192.168.1.10
  subnet_prefix: 24
  expected_driver_version: "1.9.3"
  expected_firmware_version: "1.9.2"
  home_name: dataset_collection_home
  home_source: median_first_action_across_400_episodes
  home_arm_positions_rad:
    - -0.00019073777366429567
    - 1.046196699142456
    - 0.5239566564559937
    - 0.6292439103126526
    - -0.000572213320992887
    - 0.00019073777366429567
  home_gripper_position_m: 0.0
  folded_pose_name: pre_dataset_home_folded_pose
  folded_pose_source: cartesian_step_z_positive_20260817T080707Z_initial_state
  folded_arm_positions_rad:
    - 0.02193484455347061
    - 0.0
    - 0.0
    - -0.018120087683200836
    - -0.0078202486038208
    - 0.07953765243291855

action_contract:
  dimensions: 7
  semantics: [joint_0_position, joint_1_position, joint_2_position, joint_3_position, joint_4_position, joint_5_position, gripper_position]
  arm_units: rad
  gripper_units: m
  frame: joint
  source: original_lerobot_action_column
  driver_command: set_all_positions
  ik_required: false
  physical_actuation: VERIFIED_BY_359_FRAME_DEMO_REPLAY
  enabled: false

# This matches the original LeRobot collector and the successful demo replay.
# Learned-policy actuation remains fail-closed until the new checkpoint passes
# shadow diagnostics and an explicitly supervised bounded rollout.
hrp_driver_contract:
  action_representation: absolute
  action_space: joint_position
  execution: bounded_joint_position_rollout
  control_fps: 20.0
  command_goal_time_s: 0.1
  command_blocking: false
  driver_call: set_all_positions
  ik_required: false
  limits_source: policy_evaluation.clipped_rollout.dataset_action_limits
  recommended_firmware: "1.9.3"
  current_validated_firmware: "1.9.2"
  learned_policy_release: BLOCKED_PENDING_SHADOW_AND_SUPERVISED_TEST

cameras:
  cam_main:
    model: Intel RealSense D435
    serial_number: "838212073584"
    asic_serial_number: "843213020438"
    usb_serial: UNAVAILABLE
    physical_path: /sys/devices/pci0000:80/0000:80:14.0/usb3/3-13/3-13.2/3-13.2:1.0/video4linux/video6
    v4l2_node: UNRESOLVED
  cam_wrist:
    model: Intel RealSense D405
    serial_number: "409122274608"
    asic_serial_number: "242623072067"
    usb_serial: UNAVAILABLE
    physical_path: /sys/devices/pci0000:80/0000:80:14.0/usb4/4-7/4-7:1.0/video4linux/video0
    v4l2_node: UNRESOLVED
  stream: color
  format: rgb8
  width: 640
  height: 480
  fps: 30

safety:
  dry_run_by_default: true
  require_explicit_execute_flag: true
  require_operator_confirmation: true
  require_emergency_stop_ready: true
  workspace_limits: CALIBRATING
  max_joint_delta_rad: 0.07
  # Dataset measured-state maxima are 2.747 rad/s and 0.0881 m/s at 20 Hz.
  max_joint_velocity_rad_s: 2.8
  max_gripper_delta_m: 0.003
  max_gripper_velocity_m_s: 0.09

policy_evaluation:
  camera_capture_fps: 30.0
  home_goal_time_s: 10.0
  gripper_goal_time_s: 2.0
  max_home_tracking_error_rad: 0.03
  max_home_gripper_error_m: 0.002
  inference_warmup_steps: 3
  minimum_observed_rate_hz: 18.0
  # Keep the first executed command at the exact configured dataset home while
  # still recording the first raw prediction. Subsequent steps remain visual
  # closed-loop policy actions.
  force_first_action_home: true
  # Preserve collection timing. alpha=1 leaves the policy target unchanged;
  # Driver interpolation and all rollout limits remain active.
  action_ema_alpha: 1.0
  clipped_rollout:
    # Permit an explicitly requested rollout beyond the 359-frame dataset
    # horizon for diagnostics. All action and tracking limits remain active.
    max_steps: 900
    # Per-frame maxima across all 35,900 carrot frames. These preserve the
    # demonstrated dynamics while rejecting targets outside dataset support.
    max_action_delta:
      [0.04615854099392891, 0.060654640197753906, 0.08506894111633301, 0.13237200677394867, 0.0644693672657013, 0.08545053005218506, 0.004429406486451626]
    # Two 20 Hz command periods match the collector's 0.1 s interpolation.
    # This caps how far the command stream may run ahead of measured motion.
    max_command_lead:
      [0.09231708198785782, 0.12130928039550781, 0.17013788223266602, 0.26474401354789734, 0.1289387345314026, 0.17090106010437012, 0.008858812972903252]
    dataset_action_limits:
      pick_and_place_carrot_100:
        min: [-0.6322957, 0.5960556, 0.5220493, -1.5905623, -0.2038987, -0.9504463, -0.0004923]
        max: [0.6002518, 2.5183108, 2.3691540, 0.6891356, 0.5243381, 0.8939880, 0.0404405]
    control_fps: 20.0
    min_time_to_move_multiplier: 2.0
    command_blocking: false
    max_tracking_error:
      [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.001]

demo_replay:
  start_goal_time_s: 5.0
  start_gripper_goal_time_s: 2.0
  command_goal_time_s: 0.1
  max_tracking_error: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.001]

workspace_calibration:
  status: collecting_points
  required_labels:
    - task_center
    - left_safe
    - right_safe
    - front_safe
    - back_safe
    - lowest_safe
    - highest_safe
    - demo_start_safe
  inward_margin_m:
    x: 0.02
    y: 0.02
    z_lower: 0.03
    z_upper: 0.02

diagnostic_tests:
  position_hold:
    duration_s: 2.0
    sample_rate_hz: 20.0
    max_arm_drift_rad: 0.02
    max_gripper_drift_m: 0.002
  current_position_hold:
    goal_time_s: 1.0
    duration_s: 2.0
    sample_rate_hz: 20.0
    max_arm_error_rad: 0.02
    max_gripper_error_m: 0.002
  gripper_cycle:
    open_delta_m: 0.005
    goal_time_s: 2.0
    hold_duration_s: 0.5
    sample_rate_hz: 20.0
    max_tracking_error_m: 0.001
  whole_arm_cycle:
    joint_deltas_rad: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03]
    goal_time_s: 3.0
    hold_duration_s: 0.5
    sample_rate_hz: 20.0
    max_tracking_error_rad: 0.02
    joint_limit_margin_rad: 0.01
  folded_pose_return:
    goal_time_s: 10.0
    expected_start_tolerance_rad: 0.08
    max_tracking_error_rad: 0.03
  cartesian_step:
    home_goal_time_s: 10.0
    max_home_tracking_error_rad: 0.03
    goal_time_s: 2.0
    hold_duration_s: 0.5
    max_translation_step_m: 0.01
    max_downward_step_m: 0.005
    max_tracking_error_m: 0.005
    trajectory_check_samples: 1000

workspace_probe:
  step_m: 0.002
  goal_time_s: 0.75
  return_goal_time_s: 2.0
  max_tracking_error_m: 0.005
  trajectory_check_samples: 1000
  hard_travel_limits_m:
    x_positive: 0.10
    x_negative: 0.10
    y_positive: 0.10
    y_negative: 0.10
    z_positive: 0.10
    z_negative: 0.130
