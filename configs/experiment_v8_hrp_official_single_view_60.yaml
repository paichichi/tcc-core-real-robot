project: tcc-core-real-robot
seed: 292285

dataset:
  repository: UoA-Trossen-Arm/pick_and_place_4_object_diverse
  revision: 6ce893dc73fc6310ccbd46786f71a03a5b6a3da2
  local_root: datasets/pick_and_place_4_object_diverse
  demonstrations_per_task: 100
  tasks:
    - pick_and_place_carrot_100

observations:
  fps: 20
  cameras: [cam_main]
  resolution: [640, 480]

backbone:
  source: huggingface
  hub_name: hrp_imagenet
  checkpoint: null
  tcc_source_root: TBD
  frozen: false
  fine_tuning: full_end_to_end
  image_size: 224

model_hub:
  repository: Chipaipai/tcc-core-real-robot-policies
  revision: e40f3fe4a459cc6cbbbf338d07cd651455978213
  backbone_manifest: backbones/manifest.json
  policy_checkpoint_template: policies_v8_hrp_cartesian_velocity/{backbone}/hrp_official/checkpoint_150000.pt
  policy_metrics_template: policies_v8_hrp_cartesian_velocity/{backbone}/hrp_official/metrics.json
  supported_backbones: [ours_rn50, ours_vit, r3m_unadapted, d4r_imagenet]
  supported_demonstrations: [100]

policy:
  implementation: tcc_mlp_bc_v8_hrp_cartesian_velocity
  architecture: hrp_state_token_gmm
  reference: data4robotics_hrp_release_default
  cameras: [cam_main]
  shared_camera_backbone: false
  camera_fusion: raw_concat
  camera_projection_dim: 0
  camera_gate_hidden_dim: 0
  task_conditioning: null
  number_of_tasks: 1
  proprioception: true
  proprioception_dim: 7
  progress_conditioning: null
  progress_dim: 0
  action_dim: 7
  action_chunk_size: 1
  action_representation: cartesian_velocity
  action_frame: robot_base
  dataset_pose_representation: intrinsic_xyz_roll_pitch_yaw
  driver_pose_representation: angle_axis
  rotation_velocity: angle_axis_spatial
  gripper_action: velocity
  action_distribution: gaussian_mixture
  num_modes: 5
  min_std: 0.0001
  deterministic_inference: null
  inference: official_zero_std_mixture_sample
  hidden_dimensions: [512, 512]
  activation: relu
  dropout: 0.2
  input_batch_norm: true
  input_layer_norm: false
  output_layer_scale: 1.0
  normalize_state: false
  normalize_actions: false
  optimizer: adam
  weight_decay: 0.0001
  loss: gmm_nll
  training_steps: 150000
  batch_size: 150
  learning_rate: 0.0003
  num_workers: 10
  eval_every: 10000
  evaluation_samples: 500

augmentation:
  name: medium
  random_resized_crop_scale: [0.9, 1.0]
  gaussian_blur: true
  imagenet_normalization: true

evaluation:
  max_rollout_steps: 359

split:
  protocol: hrp_fixed_transition_holdout
  shuffle_seed: 3904767649
  held_out_transitions: 500
